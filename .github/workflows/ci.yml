name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install dependency
        run: pip install -r requirements.txt
      - name: run tests
        run: python3 -m pytest


